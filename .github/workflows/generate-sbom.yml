name: Generate sbom
permissions:
  contents: "write"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Which tag to generate the sbom for?"
        type: "string"
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Which tag to generate the sbom for?"
        type: "string"
        required: true

jobs:
  sbom:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Keep in sync with `targets` and `github-custom-runners` in dist-workspace.toml.
      # Each SBOM is generated and audited on the runner that builds that release: `--target`
      # only selects target dependencies, while build dependencies (proc macros, build scripts)
      # resolve for the host running cargo, so a Linux host would describe a cross-build.
      # Every target ships two binaries (see release.yml): the OSS build from cargo-dist and the
      # enterprise build (`--features enterprise`), so each gets its own SBOM.
      matrix:
        edition: [oss, enterprise]
        target:
          - aarch64-apple-darwin
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - edition: oss
            features: ""
            # Matches the cargo-dist archive names (unleash-edge-<target>).
            sbom_name: unleash-edge
          - edition: enterprise
            features: enterprise
            # Matches the enterprise archive names (unleash-edge-enterprise-<version>-<target>).
            sbom_name: unleash-edge-enterprise
    # Bash on every runner, including Windows (Git Bash), so the scripts behave the same.
    defaults:
      run:
        shell: bash
    env:
      SBOM_ATTEST_VERSION: "0.4.9"
      SBOM_TARGET: ${{ matrix.target }}
      SBOM_FEATURES: ${{ matrix.features }}
      SBOM_BASENAME: ${{ matrix.sbom_name }}-${{ matrix.target }}
      TAG_FROM_INPUT: ${{ inputs.tag }}
      TAG_FROM_EVENT_INPUT: ${{ github.event.inputs.tag }}
      TAG_FROM_RELEASE: ${{ github.event.release.tag_name }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${TAG_FROM_INPUT:-${TAG_FROM_EVENT_INPUT:-${TAG_FROM_RELEASE:-}}}"
          if [ -z "$TAG" ]; then
            echo "Could not determine release tag from workflow inputs or release event."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # The SBOM must describe the tagged release, not whatever the default branch is now.
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: Install sbom-attest
        run: |
          set -euo pipefail
          cargo install sbom-attest --version "$SBOM_ATTEST_VERSION" --locked
      # --name puts the target in the SPDX document name (and the root component's display
      # name); the purl stays pkg:cargo/unleash-edge@<version> so scanners still match it.
      # --features must match the release build, or the SBOM omits the feature-gated crates.
      - name: Generate SBOMs (CycloneDX + SPDX)
        run: |
          set -euo pipefail
          feature_args=()
          if [ -n "$SBOM_FEATURES" ]; then
            feature_args=(--features "$SBOM_FEATURES")
          fi
          sbom-attest generate --locked \
            --package unleash-edge \
            --target "$SBOM_TARGET" ${feature_args[@]+"${feature_args[@]}"} \
            --name "$SBOM_BASENAME" \
            --author "Bricks Software AS" \
            --producer "Bricks Software AS" \
            --cdx "${SBOM_BASENAME}.cdx.json" \
            --spdx "${SBOM_BASENAME}.spdx.json"
      # Fails the job if the SBOM disagrees with Cargo.lock / the crate graph for this target.
      # no-license is waived: the enterprise crates declare `license-file` (proprietary, no SPDX
      # expression) and the libgit2 C library vendored by libgit2-sys (build-time, via shadow-rs)
      # carries no declared license. The waiver is recorded in the report.
      - name: Audit SBOM
        run: |
          set -euo pipefail
          feature_args=()
          if [ -n "$SBOM_FEATURES" ]; then
            feature_args=(--features "$SBOM_FEATURES")
          fi
          sbom-attest audit "${SBOM_BASENAME}.cdx.json" --locked \
            --package unleash-edge \
            --target "$SBOM_TARGET" ${feature_args[@]+"${feature_args[@]}"} \
            --waive no-license \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json "${SBOM_BASENAME}.sbom-audit.json"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.edition }}-${{ matrix.target }}
          path: |
            ${{ env.SBOM_BASENAME }}.cdx.json
            ${{ env.SBOM_BASENAME }}.spdx.json
            ${{ env.SBOM_BASENAME }}.sbom-audit.json
          if-no-files-found: error
          retention-days: 3
  attach-to-release:
    runs-on: ubuntu-latest
    needs: sbom
    steps:
      - uses: actions/checkout@v7
        name: Checkout code
      - name: Download sbom artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          merge-multiple: true
          path: ./downloaded
      - name: Upload file to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_FROM_INPUT: ${{ inputs.tag }}
          TAG_FROM_EVENT_INPUT: ${{ github.event.inputs.tag }}
          TAG_FROM_RELEASE: ${{ github.event.release.tag_name }}
        run: |
          TAG="${TAG_FROM_INPUT:-${TAG_FROM_EVENT_INPUT:-${TAG_FROM_RELEASE:-}}}"
          if [ -z "$TAG" ]; then
            echo "Could not determine release tag from workflow inputs or release event."
            exit 1
          fi
          gh release upload "$TAG" downloaded/unleash-edge-*.json --clobber
