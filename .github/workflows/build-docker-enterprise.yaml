name: Build and Push Enterprise Docker Image (Chef)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/*.toml"
      - "**/*.lock"
      - ".github/workflows/build-docker-enterprise.yaml"
      - "docs/dockerhub-enterprise.md"
      - "Dockerfile"
    tags:
      - "unleash-edge-v[0-9]+.[0-9]+.[0-9]+*"
  pull_request:
    paths:
      - "**/*.rs"
      - "**/*.toml"
      - "**/*.lock"
      - ".github/workflows/build-docker-enterprise.yaml"
      - "docs/dockerhub-enterprise.md"
      - "Dockerfile"
  workflow_dispatch:

env:
  DOCKERHUB_SLUG: unleashorg/unleash-edge-enterprise
  GHCR_SLUG: ghcr.io/unleash/unleash-edge-enterprise
  ECR_SLUG: public.ecr.aws/unleashorg/unleash-edge-enterprise

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  prepare-bake-file:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Create matrix
        id: platforms
        run: |
          echo "matrix=$(docker buildx bake image-all --print | jq -cr '.target."image-all".platforms')" >>${GITHUB_OUTPUT}
      - name: Show matrix
        run: |
          echo ${{ steps.platforms.outputs.matrix }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.DOCKERHUB_SLUG }}
            ${{ env.GHCR_SLUG }}
            ${{ env.ECR_SLUG }}
          tags: |
            type=match,pattern=v(\d+\.\d+.\d+),group=1,prefix=v
            type=match,pattern=v(\d+\.\d+).*,group=1,prefix=v
            type=ref,event=pr
            type=edge
          labels: |
            org.containers.image.title=Unleash Edge Enterprise
            org.containers.image.vendor=Unleash
      - name: Rename meta bake definition file
        run: |
          mv "${{ steps.meta.outputs.bake-file }}" "/tmp/bake-meta.json"
      - name: Upload meta bake definition
        uses: actions/upload-artifact@v7
        with:
          name: bake-meta
          path: /tmp/bake-meta.json
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    needs:
      - prepare-bake-file
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.prepare-bake-file.outputs.matrix) }}
    steps:
      - name: Setup Platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download meta bake definition
        uses: actions/download-artifact@v8
        with:
          name: bake-meta
          path: /tmp
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to docker hub
        uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Github Container registry
        uses: docker/login-action@v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        if: github.event_name != 'pull_request'
        with:
          role-to-assume: arn:aws:iam::726824350591:role/unleash-github-ecr-public-publish-role
          role-session-name: edge-actions-push-to-ecr-public
          aws-region: us-east-1
      - name: Login to AWS ECR
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        if: github.event_name != 'pull_request'
        with:
          registry-type: public
      - name: Build and bake
        id: bake
        uses: docker/bake-action@v7
        with:
          files: |
            ./docker-bake.hcl
            /tmp/bake-meta.json
          targets: image
          source: .
          set: |
            *.tags=
            *.platform=${{ matrix.platform }}
            *.args.CARGO_FEATURES=enterprise
            *.target=enterprise-runtime
            *.cache-from=type=gha,scope=enterprise-${{ env.PLATFORM_PAIR }}
            *.cache-to=type=gha,scope=enterprise-${{ env.PLATFORM_PAIR }}
            *.output=type=image,"name=${{ env.DOCKERHUB_SLUG }},${{ env.GHCR_SLUG }},${{ env.ECR_SLUG }}",push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
      - name: Export digests
        run: |
          mkdir -p /tmp/digests
          digest="${{ fromJSON(steps.bake.outputs.metadata).image['containerimage.digest'] }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Install syft
        if: startsWith(github.ref, 'refs/tags/')
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
      - name: Generate SBOM
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ fromJSON(steps.bake.outputs.metadata).image['containerimage.digest'] }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sbom
          # Scan the exact pushed digest (GHCR avoids Docker Hub pull rate limits).
          # --platform matters: the pushed digest may be an index (image + BuildKit provenance).
          syft scan "registry:${GHCR_SLUG}@${DIGEST}" \
            --platform "${{ matrix.platform }}" \
            -o "spdx-json=/tmp/sbom/sbom-${PLATFORM_PAIR}.spdx.json"
      - name: Upload SBOM
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ env.PLATFORM_PAIR }}
          path: /tmp/sbom/sbom-${{ env.PLATFORM_PAIR }}.spdx.json
          if-no-files-found: error

  merge:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs:
      - build
    steps:
      - name: Download meta bake definition
        uses: actions/download-artifact@v8
        with:
          name: bake-meta
          path: /tmp
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      # Separate directory: /tmp/digests must only contain digest files (used by `printf ... *`).
      - name: Download SBOMs
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v8
        with:
          path: /tmp/sbom
          pattern: sbom-*
          merge-multiple: true
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Login to docker hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Github Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::726824350591:role/unleash-github-ecr-public-publish-role
          role-session-name: edge-actions-push-to-ecr-public
          aws-region: us-east-1
      - name: Login to AWS ECR
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.target."docker-metadata-action".tags | map(select(startswith("${{ env.DOCKERHUB_SLUG }}")) | "-t " + .) | join(" ")' /tmp/bake-meta.json) \
            $(printf '${{ env.DOCKERHUB_SLUG }}@sha256:%s ' *)
          docker buildx imagetools create $(jq -cr '.target."docker-metadata-action".tags | map(select(startswith("${{ env.GHCR_SLUG }}")) | "-t " + .) | join(" ")' /tmp/bake-meta.json) \
            $(printf '${{ env.GHCR_SLUG }}@sha256:%s ' *)
          docker buildx imagetools create $(jq -cr '.target."docker-metadata-action".tags | map(select(startswith("${{ env.ECR_SLUG }}")) | "-t " + .) | join(" ")' /tmp/bake-meta.json) \
            $(printf '${{ env.ECR_SLUG }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          tag=$(jq -r '.target."docker-metadata-action".args.DOCKER_META_VERSION' /tmp/bake-meta.json)
          docker buildx imagetools inspect ${{ env.DOCKERHUB_SLUG }}:${tag}
          docker buildx imagetools inspect ${{ env.GHCR_SLUG }}:${tag}
          docker buildx imagetools inspect ${{ steps.login-ecr-public.outputs.registry }}/unleashorg/unleash-edge-enterprise:${tag}
      # Sign the multi-arch index users actually pull (plus its per-platform manifests via
      # --recursive) and attach one SBOM attestation per platform. Signatures are stored per
      # repository, so this runs once for each registry. Tagged releases only.
      - name: Sign images and attest SBOMs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag=$(jq -r '.target."docker-metadata-action".args.DOCKER_META_VERSION' /tmp/bake-meta.json)
          for slug in "$DOCKERHUB_SLUG" "$GHCR_SLUG" "$ECR_SLUG"; do
            digest=$(docker buildx imagetools inspect "${slug}:${tag}" --format '{{json .Manifest}}' | jq -r .digest)
            ref="${slug}@${digest}"
            echo "Signing ${ref}"
            cosign sign --yes --recursive "$ref"
            for sbom in /tmp/sbom/*.spdx.json; do
              echo "Attesting $(basename "$sbom") -> ${ref}"
              cosign attest --yes --type spdxjson --predicate "$sbom" "$ref"
            done
          done

      - name: Verify signatures and SBOM attestations
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag=$(jq -r '.target."docker-metadata-action".args.DOCKER_META_VERSION' /tmp/bake-meta.json)
          ID_ARGS=(
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-docker-enterprise.yaml@"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          )
          for slug in "$DOCKERHUB_SLUG" "$GHCR_SLUG" "$ECR_SLUG"; do
            cosign verify "${ID_ARGS[@]}" "${slug}:${tag}" > /dev/null
            cosign verify-attestation --type spdxjson "${ID_ARGS[@]}" "${slug}:${tag}" > /dev/null
            echo "verified signature + SBOM: ${slug}:${tag}"
          done

  update-dockerhub-description:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs:
      - merge
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_SLUG }}
          short-description: Enterprise Edge, a high-performance proxy for scaling Unleash SDK connections
          readme-filepath: ./docs/dockerhub-enterprise.md
